<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #dff6ff, #c8b6ff, #ffc8dd);
        }

        nav {
            padding: 20px;
        }

        nav img {
            width: 35px;
            height: 35px;
        }

        #cart-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        #cart-container > div {
            background-color: rgb(213, 90, 176);
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }

        #cart-container img {
            width: 200px;
            height: 200px;
            object-fit: contain;
        }

        #total {
            text-align: center;
            font-size: 30px;
        }

        .empty-cart {
            text-align: center;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="./indexx.html">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQtNil2RfIFFuXDHK0D-yiMsykUOMMHEq7xsAtDh_it1Q&s=10"
                     alt="Back">
            </a>
        </nav>
    </header>

    <main>

        <div id="cart-container"></div>

        <h1 id="total"></h1>

    </main>

    <footer>
    </footer>

    <script src="./ecommerce.js"></script>

</body>

</html>
